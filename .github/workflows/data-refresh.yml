name: Refresh game data

on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: game-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh due data sources
        id: sync
        continue-on-error: true
        run: npm run sync:data
      - name: Validate updated caches
        run: |
          npm run check:offline
          npm run check:data
      - name: Commit verified data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.js data/*.json data/limit-regulations/*.json
          git add data/trend-images
          git add -u data/deck-search-cache
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh verified game data"
          git push origin HEAD:main
      - name: Save data health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-health
          path: data/data-health.json
          retention-days: 14
      - name: Report source failures
        if: steps.sync.outcome == 'failure'
        run: |
          cat data/data-health.json
          exit 1
