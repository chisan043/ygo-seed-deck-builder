name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build and upload"
        required: true
        default: "v0.8.0"
      publish_release:
        description: "Publish after both platform builds pass (false only builds and validates)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate version and data
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) process.exit(1)'
          node --check app.js
          node --check electron/main.cjs
          npm run check:updates
          npm run sync:data
          npm run check:offline
          npm run check:desktop-images
          npm run check:desktop-decks
          npm run check:data
      - name: Build macOS packages
        if: runner.os == 'macOS'
        run: npm run build:mac -- --arm64 --publish never
      - name: Build Windows installer and portable package
        if: runner.os == 'Windows'
        run: |
          npm run build:win -- --publish never
          npm run build:win:installer -- --publish never
          $version = node -p "require('./package.json').version"
          Compress-Archive -Path release/win-unpacked/* -DestinationPath "release/ygo-seed-deck-builder-$version-x64-unpacked.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' || inputs.publish_release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Check update manifests and create checksums
        run: |
          test -f release/latest.yml
          test -f release/latest-mac.yml
          cd release
          sha256sum *.dmg *.zip *.exe > SHA256SUMS-${{ inputs.tag_name || github.ref_name }}.txt
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]; then
              echo "Published releases are immutable; use a new version."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" --clobber release/*
          gh release edit "$RELEASE_TAG" --draft=false --latest
