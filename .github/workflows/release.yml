name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build and upload"
        required: true
        default: "v0.6.14"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: |
          node --check app.js
          node --check tools/serve-with-refresh.mjs
          npm run check:offline

      - name: Build macOS package
        run: npm run build:mac

      - name: Build Windows portable package
        run: npm run build:win

      - name: Create Windows portable ZIP and checksums
        run: |
          version="$(node -p "require('./package.json').version")"
          win_zip="release/Yu-Gi-Oh.Seed.Deck.Builder-${version}-win-x64-unpacked.zip"
          ditto -c -k --sequesterRsrc --keepParent release/win-unpacked "$win_zip"
          (
            cd release
            shasum -a 256 \
              "Yu-Gi-Oh! Seed Deck Builder-${version}-arm64.dmg" \
              "Yu-Gi-Oh! Seed Deck Builder-${version}-arm64-mac.zip" \
              "Yu-Gi-Oh.Seed.Deck.Builder-${version}-win-x64-unpacked.zip" \
              > "SHA256SUMS-v${version}.txt"
          )

      - name: Upload release assets
        run: |
          tag="${{ inputs.tag_name || github.ref_name }}"
          version="$(node -p "require('./package.json').version")"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --latest --generate-notes
          fi
          gh release upload "$tag" --clobber \
            "release/Yu-Gi-Oh! Seed Deck Builder-${version}-arm64.dmg" \
            "release/Yu-Gi-Oh! Seed Deck Builder-${version}-arm64-mac.zip" \
            "release/Yu-Gi-Oh.Seed.Deck.Builder-${version}-win-x64-unpacked.zip" \
            "release/SHA256SUMS-v${version}.txt"
